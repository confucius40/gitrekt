[package]
name = "gitrekt-front"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "AGPL-3.0-only"

[lib]
path = "src/main.rs"
crate-type = ["cdylib"]

[dependencies]
slint = "1.17.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[build-dependencies]
slint-build = "1.17.1"
